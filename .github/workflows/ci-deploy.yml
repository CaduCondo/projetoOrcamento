name: Testes e publicação

# A cada envio ao GitHub: roda os testes. Se for na main ou na dev e os testes passarem,
# publica o site: PRODUÇÃO na raiz (branch main) e TESTE em /dev/ (branch dev).
# São dois grupos de testes: os de lógica/tela simulada ("testes") e os de PONTA A PONTA num Chrome de verdade ("e2e").
# Se qualquer um falhar, NADA é publicado.
# Ao terminar (push em main/dev): o relatório dos testes é publicado em /relatorio/<branch>/ (só quando tudo passa),
# cada cenário reprovado vira uma issue `bug` (fecha sozinha quando passa de novo) e o resultado é comentado na issue
# "📬 Resultados do CI" mencionando o dono: o GitHub manda o e-mail com o resumo e os links (tools/ci/relatar.js).
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4          # o emulador do Firestore (testes das regras de segurança) precisa de Java
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - name: Regras de segurança do banco (emulador do Firebase)
        run: npm run test:rules
      - name: Carga e estresse do porteiro (limite de pedidos, sem 5xx, sem passar do limite da Pluggy)
        run: npm run carga:porteiro

  e2e:
    name: Testes de ponta a ponta (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artefato-url: ${{ steps.relatorio.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Versão do Playwright (para o cache do navegador)
        id: pw
        run: echo "versao=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache-navegador
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versao }}
      - name: Instalar o Chrome do Playwright
        if: steps.cache-navegador.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Instalar só as bibliotecas do sistema (navegador já em cache)
        if: steps.cache-navegador.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Rodar os cenários (app montado, aberto num Chrome de verdade)
        run: npm run e2e
      - name: Conferir que nenhum cenário foi pulado ou esquecido
        run: npm run e2e:ver
      - name: Guardar relatório, fotos e resultado (sempre, passando ou não)
        id: relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-relatorio
          path: |
            playwright-report/
            test-results/
            e2e/resultado.json
          if-no-files-found: ignore
          retention-days: 14

  e2e-nuvem:
    name: Testes da nuvem (Chrome + emuladores do Firebase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artefato-url: ${{ steps.relatorio.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4          # os emuladores do Firebase (Firestore) precisam de Java
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Versão do Playwright (para o cache do navegador)
        id: pw
        run: echo "versao=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache-navegador
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versao }}
      - name: Instalar o Chrome do Playwright
        if: steps.cache-navegador.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Instalar só as bibliotecas do sistema (navegador já em cache)
        if: steps.cache-navegador.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Rodar os cenários da nuvem (app de verdade no Chrome, emuladores de login e banco, regras reais)
        run: npm run e2e:nuvem:emu
      - name: Conferir que nenhum cenário da nuvem foi pulado ou esquecido
        run: npm run e2e:nuvem:ver
      - name: Guardar relatório, fotos e resultado (sempre, passando ou não)
        id: relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-nuvem-relatorio
          path: |
            playwright-report-nuvem/
            test-results-nuvem/
            e2e/resultado-nuvem.json
          if-no-files-found: ignore
          retention-days: 14

  publicar:
    name: Publicar site
    needs: [testes, e2e, e2e-nuvem]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read                                 # para conferir que o pacote do site já apareceu na lista da execução
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4          # relatório dos testes desta execução
        with:
          name: e2e-relatorio
          path: relatorio-baixado
      - uses: actions/download-artifact@v4
        with:
          name: e2e-nuvem-relatorio
          path: relatorio-baixado-nuvem
      - name: Trazer o último relatório do outro ambiente (para os dois relatórios ficarem sempre abertos)
        continue-on-error: true                     # se não houver (ou expirou), o outro relatório fica de fora desta vez
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          outro=$([ "$GITHUB_REF_NAME" = main ] && echo dev || echo main)
          for artefato in e2e-relatorio e2e-nuvem-relatorio; do
            id=$(gh run list --repo "${{ github.repository }}" --branch "$outro" --event push --status success --limit 5 --json databaseId --jq '.[].databaseId' | while read r; do
                   gh api "repos/${{ github.repository }}/actions/runs/$r/artifacts" --jq ".artifacts[]|select(.name==\"$artefato\" and .expired==false)|.id" | grep -q . && echo "$r" && break
                 done)
            if [ -n "$id" ]; then gh run download "$id" --repo "${{ github.repository }}" -n "$artefato" -D "relatorio-outro/$artefato" && echo "$artefato de $outro trazido da execução $id"; else echo "sem $artefato recente de $outro"; fi
          done
      - name: Montar o site (produção na raiz, teste em /dev/, relatório em /relatorio/<branch>/)
        run: |
          mkdir -p _site/dev _site/relatorio
          (cd main && python build.py --env prod --out ../_site/index.html)
          (cd dev  && python build.py --env dev  --out ../_site/dev/index.html)
          if [ -d relatorio-baixado/playwright-report ]; then cp -r relatorio-baixado/playwright-report "_site/relatorio/${GITHUB_REF_NAME}"; fi
          outro=$([ "$GITHUB_REF_NAME" = main ] && echo dev || echo main)
          if [ -d relatorio-baixado-nuvem/playwright-report-nuvem ]; then cp -r relatorio-baixado-nuvem/playwright-report-nuvem "_site/relatorio/${GITHUB_REF_NAME}-nuvem"; fi
          if [ -d relatorio-outro/e2e-relatorio/playwright-report ]; then cp -r relatorio-outro/e2e-relatorio/playwright-report "_site/relatorio/$outro"; fi
          if [ -d relatorio-outro/e2e-nuvem-relatorio/playwright-report-nuvem ]; then cp -r relatorio-outro/e2e-nuvem-relatorio/playwright-report-nuvem "_site/relatorio/$outro-nuvem"; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Esperar o pacote do site aparecer na lista da execução
        # O GitHub às vezes demora a listar o pacote recém-enviado e o deploy falha com "No artifacts named github-pages" (visto nas execuções 80 e 81).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 24); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[]|select(.name=="github-pages")]|length')
            [ "$n" = "1" ] && { echo "pacote do site listado"; sleep 10; exit 0; }
            echo "ainda não listado ($n)..."; sleep 5
          done
          echo "o pacote não apareceu na lista; vou tentar publicar mesmo assim"
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Esperar e tentar publicar de novo (só se a primeira tentativa falhou)
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

  avisar:
    name: Avisar o resultado (issues e e-mail)
    needs: [testes, e2e, e2e-nuvem, publicar]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true                     # se os testes nem chegaram a rodar, não há relatório
        with:
          name: e2e-relatorio
          path: relatorio-baixado
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: e2e-nuvem-relatorio
          path: relatorio-baixado-nuvem
      - name: Abrir/fechar issues de bug e comentar o resultado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTEFATO_URL: ${{ needs.e2e.outputs.artefato-url }}
          ARTEFATO_NUVEM_URL: ${{ needs.e2e-nuvem.outputs.artefato-url }}
          PAGINA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/relatorio/${{ github.ref_name }}/
          PAGINA_NUVEM_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/relatorio/${{ github.ref_name }}-nuvem/
          R_TESTES: ${{ needs.testes.result }}
          R_E2E: ${{ needs.e2e.result }}
          R_E2E_NUVEM: ${{ needs.e2e-nuvem.result }}
          R_PUBLICAR: ${{ needs.publicar.result }}
          RESULTADO_JSON: relatorio-baixado/e2e/resultado.json
          RESULTADO_NUVEM_JSON: relatorio-baixado-nuvem/e2e/resultado-nuvem.json
        run: node tools/ci/relatar.js
