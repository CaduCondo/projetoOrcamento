<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu Orçamento</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mut:#6b7686;--line:#e4e8ee;--acc:#2f6fed;--acc2:#e8f0fe;--pos:#12805c;--neg:#c2410c;--warn:#b45309;--shadow:0 1px 2px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b212a;--ink:#e8ecf2;--mut:#93a0b2;--line:#2c3542;--acc:#6ea0ff;--acc2:#1f2b45;--pos:#3ecf9b;--neg:#ff9a5c;--warn:#f0b04a;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:14px;padding:10px 0;flex-wrap:wrap}
h1{font-size:18px;margin:0}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;color:var(--mut);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--acc2);color:var(--acc);font-weight:600}
.right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main{padding:16px 0 60px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.card .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.card .v{font-size:22px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip.cur{border-style:dashed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--mut);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.quick{display:flex;gap:8px;flex-wrap:wrap;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:16px}
.quick label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.quick label.ck{flex-direction:row;align-items:center;font-size:13px;color:var(--ink);padding-bottom:9px}
.quick .grow{flex:1;min-width:160px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input.money{text-align:right}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--acc2);color:var(--acc)}
.btn.dan{background:transparent;color:var(--neg);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel h2{margin:0;padding:12px 14px;font-size:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
table{border-collapse:collapse;width:100%}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr[draggable=true]{cursor:grab}
tr.dragging{opacity:.4}
tr.over td{border-top:2px solid var(--acc)}
td.grip{width:22px;color:var(--mut);opacity:.5;padding-right:0;user-select:none}
.val{background:none;border:1px dashed transparent;border-radius:8px;padding:4px 8px;font:inherit;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.val:hover{border-color:var(--acc);background:var(--acc2)}
.sub{color:var(--mut);font-size:12px}
.tot td{font-weight:650}
.warn{color:var(--warn)}
.ok{width:18px;height:18px;accent-color:var(--pos);cursor:pointer}
.grid{overflow:auto;max-height:75vh}
.grid table{border-collapse:separate;border-spacing:0}
.grid th{position:sticky;top:0;background:var(--card);z-index:2}
.grid td:first-child,.grid th:first-child{position:sticky;left:0;background:var(--card);z-index:1;min-width:190px;border-right:1px solid var(--line)}
.grid th:first-child{z-index:4}
.grid tr.tot td{background:var(--bg)}
.grid tr.tot td:first-child{background:var(--bg)}
.grid tr.secr td{background:var(--bg);font-weight:650;color:var(--mut);font-size:12px;letter-spacing:.05em}
.grid .val{padding:2px 6px}
.zero{color:var(--mut);opacity:.5}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:0;width:min(600px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:start;gap:10px}
.dh h3{margin:0;font-size:16px}
.db{padding:12px 16px;max-height:55vh;overflow:auto}
.item{display:grid;grid-template-columns:24px 120px 1fr 30px 30px;gap:6px;margin-bottom:6px;align-items:center}
.item button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px}
.item button.cc{opacity:.3;filter:grayscale(1)}.item button.cc.on{opacity:1;filter:none}.item.info input:not(.ok){opacity:.55;font-style:italic}
.item.prev input.money,.item.prev input:not(.ok){opacity:.65}
.df{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.gh{margin:22px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px}
.cbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.cbox h3{margin:0 0 2px;font-size:14px}.cbox p{margin:0 0 10px;font-size:12px;color:var(--mut)}
.cw{position:relative;height:300px}
.tall .cw{height:440px}
.full{grid-column:1/-1}
.hint{color:var(--mut);font-size:13px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.toast{position:fixed;bottom:16px;right:16px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:50}
.toast.on{opacity:.9}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px;max-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:none}
#tip b{font-weight:650}
#tip table{width:auto}#tip td{padding:1px 8px 1px 0;border:0;white-space:normal}
#tip .tn{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#tip .bar{height:6px;border-radius:3px;background:#6ea0ff;display:inline-block;vertical-align:middle}
.heat{overflow:auto}.heat td,.heat th{padding:5px 8px;font-size:12px}.heat td.h{text-align:right;font-variant-numeric:tabular-nums;cursor:pointer}
.login{max-width:380px;margin:8vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.login h2{margin:0 0 4px}.login label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);margin-top:12px}
.login .btn{width:100%;margin-top:16px;padding:10px}
.login .err{color:var(--neg);font-size:13px;margin-top:10px;min-height:18px}
.login a{color:var(--acc);cursor:pointer}

.fld{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.cb{position:relative;min-width:230px}
.cb .cbi{width:100%}
.cbl{position:absolute;left:0;top:calc(100% + 4px);width:max(100%,340px);max-height:340px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.28);z-index:40;padding:4px}
.cbl[hidden]{display:none}
.cbh{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:8px 10px 4px}
.cbo{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--ink);font-size:14px}
.cbo.act,.cbo:hover{background:var(--acc2)}
.cbo .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbo .tg{font-size:11px;color:var(--mut);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--mut)}
.dot.pagar{background:var(--neg)}.dot.receber{background:var(--pos)}
.shortcuts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex-basis:100%;margin-top:2px}
.shortcuts .sc{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.shortcuts .sc:hover{border-color:var(--acc);background:var(--acc2)}
.cr{display:grid;grid-template-columns:10px minmax(140px,1fr) 64px 120px 70px auto auto;gap:10px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line)}
.cr:last-child{border-bottom:0}
.cr input.cn{border-color:transparent;background:transparent;padding:5px 7px;width:100%}
.cr input.cn:hover,.cr input.cn:focus{border-color:var(--line);background:var(--bg)}
.cr input.cd{width:100%;text-align:center}
@media(max-width:760px){.cr{grid-template-columns:10px 1fr auto auto}.cr .xs{display:none}}
</style>
</head>
<body>
<header><div class="wrap top">
  <h1>💰 Meu Orçamento</h1>
  <nav id="nav"></nav>
  <div class="right" id="hr"></div>
</div></header>
<main class="wrap" id="app"></main>
<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>
<div id="tip"></div>
<div class="toast" id="toast">Salvo</div>

<!--FBSDK-->
<script>/*CHARTJS*/</script>
<script>
const SEED=/*SEED*/null;
const FBCFG=/*FIREBASE*/null;
const LEGACY='orcamento-app-v1';
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MC=MESES.map(m=>m.slice(0,3));
const fmtN=n=>Math.abs(n)<0.005&&!n?'':(+n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const R$=n=>(n<0?'-':'')+'R$ '+Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const RP=n=>Math.abs(n)<0.005?R$(0):'-'+R$(Math.abs(n)); // a pagar: sempre com sinal negativo
const K=v=>Math.abs(v)>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k':String(v);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseV(t){t=String(t).trim().replace(/R\$|\s/g,'');if(!t)return 0;const neg=t.startsWith('-');t=t.replace('-','');
  if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');
  const v=parseFloat(t);return isNaN(v)?0:(neg?-v:v)}
/* máscara de moeda: digita só números, vira 1.234,56 */
document.addEventListener('input',e=>{const el=e.target;if(!el.classList||!el.classList.contains('money'))return;
  const neg=el.value.includes('-'),d=el.value.replace(/\D/g,'');if(!d){el.value=neg?'-':'';return}
  el.value=(neg?'-':'')+(parseInt(d,10)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})},true);
const moneyIn=(attrs,v)=>`<input class="money" inputmode="decimal" placeholder="0,00" ${attrs} value="${v||v===0&&false?fmtN(v):''}">`;

/* ---------- ESTADO / MIGRAÇÃO ---------- */
function mig(s){if(!s.anos){const y=s.ano||2026;s.anos=[y];s.saldoIni={[y]:s.saldoInicial??0};const d={};
  for(const[k,v]of Object.entries(s.data||{})){const[c,m]=k.split('|');d[`${c}|${y}|${m}`]={items:v.items.map(i=>({v:i.v,d:i.d,ok:!!v.ok}))}}
  s.data=d;delete s.ano;delete s.saldoInicial}
  s.bens??=[];s.saldos??=[];s.dividas??=[];s.saldoIni??={};s.anos.sort((a,b)=>a-b);return s}
function blank(){const y=new Date().getFullYear(),c=(t,n,dia)=>({id:'c'+Math.random().toString(36).slice(2,8),tipo:t,nome:n,dia:dia||null});
  return{anos:[y],saldoIni:{},saldos:[],dividas:[],bens:[],data:{},cats:[c('receber','Salário',5),c('receber','Outras receitas'),c('pagar','Moradia',10),c('pagar','Contas (luz, água, internet)'),c('pagar','Mercado'),c('pagar','Transporte'),c('pagar','Saúde'),c('pagar','Lazer'),c('pagar','Outras despesas')]}}

/* ---------- NUVEM (Firebase) — ativa só quando há configuração ---------- */
const CLOUD=!!FBCFG&&typeof firebase!=='undefined';
let fbAuth=null,fbDb=null,uid=null,saveTimer=null,flushP=Promise.resolve(),snap={meta:'',years:{}};
if(CLOUD){firebase.initializeApp(FBCFG);fbAuth=firebase.auth();fbDb=firebase.firestore()}
const metaOf=s=>({cats:s.cats,anos:s.anos,saldoIni:s.saldoIni,saldos:s.saldos,dividas:s.dividas,bens:s.bens});
const yearsOf=s=>{const y={};for(const[k,v]of Object.entries(s.data)){const[c,yy,m]=k.split('|');(y[yy]??={})[c+'|'+m]=v}return y};
const strYears=ys=>Object.fromEntries(Object.entries(ys).map(([y,v])=>[y,JSON.stringify(v)]));
function status(t,err){const el=document.getElementById('toast');el.textContent=t;el.style.background=err?'#c2410c':'';el.style.color=err?'#fff':'';el.classList.add('on');clearTimeout(tt);if(!err&&t!=='Salvando…')tt=setTimeout(()=>el.classList.remove('on'),900)}
function cloudFlush(){clearTimeout(saveTimer);saveTimer=null;if(!CLOUD||!uid||!S)return flushP;flushP=flushP.then(doFlush);return flushP}
async function doFlush(){if(!uid||!S)return;
  const base=fbDb.collection('users').doc(uid),batch=fbDb.batch(),meta=JSON.stringify(metaOf(S)),ys=yearsOf(S),cur=strYears(ys);let n=0;
  if(meta!==snap.meta){batch.set(base.collection('meta').doc('main'),{json:meta});n++}
  for(const y of Object.keys(cur))if(snap.years[y]!==cur[y]){batch.set(base.collection('years').doc(y),{json:cur[y]});n++}
  for(const y of Object.keys(snap.years))if(!(y in cur)){batch.delete(base.collection('years').doc(y));n++}
  if(!n){status('Salvo ✓');return}
  status('Salvando…');
  try{await batch.commit();snap={meta,years:cur};status('Salvo ✓')}catch(e){console.error(e);status('Erro ao salvar — verifique a conexão',true)}}
async function cloudStart(u){uid=u.uid;user=u.email;
  const base=fbDb.collection('users').doc(uid);
  try{const[m,ys]=await Promise.all([base.collection('meta').doc('main').get(),base.collection('years').get()]);
    let st;if(m.exists){st=JSON.parse(m.data().json);st.data={};ys.forEach(d=>{const o=JSON.parse(d.data().json);for(const[k,v]of Object.entries(o)){const[c,mm]=k.split('|');st.data[`${c}|${d.id}|${mm}`]=v}});st=mig(st)}else st=blank();
    S=st;snap={meta:m.exists?JSON.stringify(metaOf(S)):'',years:m.exists?strYears(yearsOf(S)):{}};
    const cy=new Date().getFullYear();selY=S.anos.includes(cy)?cy:S.anos[S.anos.length-1];selM=selY===cy?new Date().getMonth():0;tab='mes';render();
    if(!m.exists)cloudFlush()
  }catch(e){console.error(e);S=null;document.getElementById('app').innerHTML=`<div class="login"><h2>Não foi possível carregar</h2><p class="sub">${esc(e.code||e.message)}</p><p class="sub">Verifique a internet e as regras do Firestore.</p><button class="btn" onclick="location.reload()">Tentar de novo</button> <button class="btn dan" style="margin-top:8px" onclick="fbAuth.signOut()">Sair</button></div>`}}
addEventListener('visibilitychange',()=>{if(document.hidden)cloudFlush()});addEventListener('pagehide',()=>cloudFlush());

/* ---------- CONTAS LOCAIS ---------- */
let user=null,S=null,loginMode='in';
const b64e=a=>btoa(String.fromCharCode(...a)),b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return b64e(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64d(salt),iterations:150000},k,256)))}
const users=()=>{try{return JSON.parse(localStorage.getItem('orc-users')||'{}')}catch{return{}}};
const setUsers=u=>localStorage.setItem('orc-users',JSON.stringify(u));
const dkey=e=>'orc-data-'+e;
function loadUser(e){try{const t=localStorage.getItem(dkey(e));if(t)return mig(JSON.parse(t))}catch{}return blank()}
let tt;function save(){if(CLOUD){clearTimeout(saveTimer);saveTimer=setTimeout(cloudFlush,700);status('Salvando…');return}try{localStorage.setItem(dkey(user),JSON.stringify(S))}catch{}
  const t=document.getElementById('toast');t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),900)}
function startSession(e,remember){user=e;S=loadUser(e);try{(remember?localStorage:sessionStorage).setItem('orc-sess',e)}catch{}
  selY=S.anos.includes(new Date().getFullYear())?new Date().getFullYear():S.anos[S.anos.length-1];selM=selY===new Date().getFullYear()?new Date().getMonth():0;tab='mes';render()}
function logout(){if(CLOUD){cloudFlush().then(()=>fbAuth.signOut());return}try{localStorage.removeItem('orc-sess');sessionStorage.removeItem('orc-sess')}catch{}user=null;S=null;render()}

/* ---------- CÁLCULOS ---------- */
let modo='real',tab='mes',selY=new Date().getFullYear(),selM=new Date().getMonth(),period='ano',catSel='';
const key=(c,y,m)=>`${c}|${y}|${m}`;
const cellOf=(c,y,m)=>S.data[key(c,y,m)];
const ens=(c,y,m)=>(S.data[key(c,y,m)]??={items:[]});
const itemsOf=(c,y,m,md=modo)=>(cellOf(c,y,m)?.items||[]).filter(i=>!i.info&&(md==='prev'||i.ok));
const V=(c,y,m,md=modo)=>itemsOf(c,y,m,md).reduce((a,i)=>a+(+i.v||0),0);
const cats=t=>S.cats.filter(c=>c.tipo===t);
const yearHas=(c,y)=>MC.some((_,m)=>(cellOf(c.id,y,m)?.items||[]).length>0);
const anyHas=c=>S.anos.some(y=>yearHas(c,y));
const yearEmpty=y=>!S.cats.some(c=>yearHas(c,y));
const nowIdx=()=>{const d=new Date();return d.getFullYear()*12+d.getMonth()};
function catStats(){const st={},n=nowIdx();for(const[k,v]of Object.entries(S.data)){if(!v.items.length)continue;const[c,y,m]=k.split('|'),i=(+y)*12+(+m),x=st[c]??={n:0,last:-1,recent:0};
  x.n+=v.items.length;if(i>x.last)x.last=i;if(i>n-6&&i<=n)x.recent+=v.items.length}return st}
const isActive=(c,st)=>{const x=st[c.id];return !x||x.last>=nowIdx()-23};
const lastLabel=i=>`${MC[i%12].toLowerCase()}/${Math.floor(i/12)}`;
const visCats=(t,y)=>{const st=catStats();return cats(t).filter(c=>yearEmpty(y)?isActive(c,st):(yearHas(c,y)||!st[c.id]))};
const MT=(t,y,m,md=modo)=>cats(t).reduce((a,c)=>a+V(c.id,y,m,md),0);
const SAL=(y,m,md=modo)=>MT('receber',y,m,md)-MT('pagar',y,m,md);
function iniY(y,md=modo){if(S.saldoIni[y]!=null)return S.saldoIni[y];if(y<=S.anos[0])return 0;return acum(y-1,11,md)}
function acum(y,m,md=modo){let a=iniY(y,md);for(let i=0;i<=m;i++)a+=SAL(y,i,md);return a}
const hasData=(y,m)=>MT('receber',y,m,'prev')>0||MT('receber',y,m,'real')>0;
const lastActive=y=>{let l=0;for(let m=0;m<12;m++)if(hasData(y,m))l=m;return l};
function prevMonths(y,m,n){const r=[];for(let i=n-1;i>=0;i--){let mm=m-i,yy=y;while(mm<0){mm+=12;yy--}r.push([yy,mm])}return r}
const cellTip=cid=>{};

/* ---------- RENDER GERAL ---------- */
const TABS=[['mes','Mês'],['ano','Ano'],['graf','Gráficos'],['pat','Patrimônio'],['aj','Ajustes']];
function chrome(){const n=document.getElementById('nav'),h=document.getElementById('hr');
  if(!user){n.innerHTML='';h.innerHTML='';return}

   <button class="btn sec sm" data-addyear title="Adicionar outro ano">＋ ano</button><span class="sub">${esc(user)}</span><button class="btn dan sm" data-logout>Sair</button>`}

const seg=()=>`<div class="seg" title="Realizado = só itens marcados como pagos/recebidos. Previsto = tudo."><button data-modo="real" class="${modo==='real'?'on':''}">Realizado</button><button data-modo="prev" class="${modo==='prev'?'on':''}">Previsto</button></div>`;

/* ---------- LOGIN ---------- */
function vLogin(){const first=!CLOUD&&!Object.keys(users()).length,up=loginMode==='up',rs=loginMode==='reset',hasSeed=!!SEED,pw=!(CLOUD&&rs);
  return `<form class="login" id="lf"><h2>💰 Meu Orçamento</h2><div class="sub">${up?'Criar conta':rs?(CLOUD?'Redefinir senha':'Definir nova senha'):'Entrar'}</div>
  <label>E-mail<input type="email" id="lem" required autocomplete="username"></label>
  ${pw?`<label>${rs?'Nova senha':'Senha'}<input type="password" id="lpw" required minlength="6" autocomplete="${up||rs?'new-password':'current-password'}"></label>`:''}
  ${(up||rs)&&pw?`<label>Confirmar senha<input type="password" id="lpw2" required minlength="6" autocomplete="new-password"></label>`:''}
  ${up&&first&&(hasSeed||localStorage.getItem(LEGACY))?`<label class="row" style="flex-direction:row;align-items:center;color:var(--ink)"><input type="checkbox" id="limp" checked class="ok"> Trazer os dados que já estão preenchidos (planilha 2026 e o que você lançou)</label>`:''}
  ${CLOUD?'':`<label class="row" style="flex-direction:row;align-items:center;color:var(--ink)"><input type="checkbox" id="lrem" class="ok"> Manter conectado neste navegador</label>`}
  <div class="err" id="lerr"></div><button class="btn">${up?'Criar conta':rs?(CLOUD?'Enviar link por e-mail':'Salvar nova senha e entrar'):'Entrar'}</button>
  <p class="sub" style="margin-top:14px">${up||rs?'<a data-lm="in">Voltar para entrar</a>':'Primeira vez? <a data-lm="up">Criar conta</a> · <a data-lm="reset">Esqueci minha senha</a>'}</p>
  <p class="sub">${CLOUD?'Seus dados ficam salvos na sua conta e acompanham você em qualquer aparelho.':rs?'A nova senha vale para a conta deste e-mail <b>neste navegador</b> e os dados são mantidos. Atenção: como não há servidor, isto não é uma proteção forte — qualquer pessoa com acesso a este navegador pode redefinir.':'Contas ficam só neste navegador. Faça backup em Ajustes.'}</p></form>`}
const AUTHMSG={'auth/email-already-in-use':'Este e-mail já tem conta.','auth/weak-password':'Senha fraca: use ao menos 6 caracteres.','auth/invalid-email':'E-mail inválido.','auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.','auth/too-many-requests':'Muitas tentativas. Aguarde um pouco e tente de novo.','auth/network-request-failed':'Sem conexão com a internet.'};
async function doCloudLogin(){const e=document.getElementById('lem').value.trim().toLowerCase(),p=document.getElementById('lpw')?.value||'',err=(t,ok)=>{const x=document.getElementById('lerr');x.style.color=ok?'var(--pos)':'';x.textContent=t};
  try{
    if(loginMode==='reset'){await fbAuth.sendPasswordResetEmail(e);return err('Se existir uma conta com esse e-mail, enviamos um link para redefinir a senha. Confira também o spam.',true)}
    if(loginMode==='up'){if(p!==document.getElementById('lpw2').value)return err('As senhas não conferem.');await fbAuth.createUserWithEmailAndPassword(e,p)}
    else await fbAuth.signInWithEmailAndPassword(e,p)
  }catch(x){err(AUTHMSG[x.code]||'Erro: '+(x.code||x.message))}}
async function doLogin(){if(CLOUD)return doCloudLogin();const e=lem.value.trim().toLowerCase(),p=lpw.value,err=t=>lerr.textContent=t,us=users();
  if(!crypto?.subtle)return err('Este navegador não suporta a criptografia necessária.');
  if(loginMode==='up'){if(us[e])return err('Este e-mail já tem conta neste navegador.');if(p!==lpw2.value)return err('As senhas não conferem.');
    const salt=b64e(crypto.getRandomValues(new Uint8Array(16)));us[e]={salt,hash:await hashPw(p,salt)};setUsers(us);
    const first=Object.keys(us).length===1;
    if(first&&document.getElementById('limp')?.checked){let st=null;try{const t=localStorage.getItem(LEGACY);if(t)st=JSON.parse(t)}catch{}
      localStorage.setItem(dkey(e),JSON.stringify(mig(st||(SEED?structuredClone(SEED):blank()))))}
    else localStorage.setItem(dkey(e),JSON.stringify(blank()))}
  else if(loginMode==='reset'){if(!us[e])return err('Não existe conta com este e-mail neste navegador.');if(p!==lpw2.value)return err('As senhas não conferem.');
    const salt=b64e(crypto.getRandomValues(new Uint8Array(16)));us[e]={salt,hash:await hashPw(p,salt)};setUsers(us)}
  else{const u=us[e];if(!u||await hashPw(p,u.salt)!==u.hash)return err(u?'Senha incorreta.':'Não existe conta com este e-mail neste navegador.')}
  startSession(e,lrem.checked)}

/* ---------- TOOLTIP ---------- */
const tip=document.getElementById('tip');
function tipCell(cid,y,m){const c=S.cats.find(x=>x.id===cid),its=cellOf(cid,y,m)?.items||[];
  const neg=c.tipo==='pagar',f=n=>neg?RP(n):R$(n);
  if(!its.length)return `<b>${esc(c.nome)} · ${MC[m]}/${y}</b><br><span style="opacity:.7">Sem lançamentos</span>`;
  return `<b>${esc(c.nome)} · ${MC[m]}/${y}</b><table>${its.map(i=>`<tr style="${i.info||!i.ok?'opacity:.65':''}"><td>${i.info?'💳':i.ok?'✓':'○'} ${esc(i.d||'(sem descrição)')}</td><td class="tn">${f(i.v)}</td></tr>`).join('')}
   ${its.some(i=>i.info)?'<tr><td colspan="2" style="opacity:.7">💳 = já está na fatura do cartão (não soma)</td></tr>':''}<tr><td><b>Realizado</b></td><td class="tn"><b>${f(V(cid,y,m,'real'))}</b></td></tr><tr><td>Previsto</td><td class="tn">${f(V(cid,y,m,'prev'))}</td></tr></table>`}
function tipCat(cid,y,m){const c=S.cats.find(x=>x.id===cid),neg=c.tipo==='pagar',f=n=>neg?RP(n):R$(n);
  const ms=prevMonths(y,m,6).map(([yy,mm])=>[yy,mm,V(cid,yy,mm,'real'),V(cid,yy,mm,'prev')]),mx=Math.max(1,...ms.map(x=>Math.max(x[2],x[3]))),n=ms.filter(x=>x[3]>0);
  return `<b>${esc(c.nome)}</b> <span style="opacity:.7">— últimos 6 meses</span><table>${ms.map(([yy,mm,r,p])=>`<tr><td>${MC[mm]}/${String(yy).slice(2)}</td><td><span class="bar" style="width:${Math.round(r/mx*90)}px"></span></td><td class="tn">${f(r)}</td>${p!==r?`<td class="tn" style="opacity:.6">prev. ${f(p)}</td>`:'<td></td>'}</tr>`).join('')}</table>
   <div style="opacity:.75;margin-top:4px">Média: ${f(n.length?n.reduce((a,x)=>a+x[2],0)/n.length:0)}</div>`}
document.addEventListener('mouseover',e=>{const t=e.target.closest?.('[data-tipcell],[data-tipcat]');if(!t){tip.style.display='none';return}
  const d=t.dataset.tipcell||t.dataset.tipcat,[c,y,m]=d.split('|');tip.innerHTML=t.dataset.tipcell?tipCell(c,+y,+m):tipCat(c,+y,+m);tip.style.display='block'});
document.addEventListener('mousemove',e=>{if(tip.style.display==='none')return;const w=tip.offsetWidth,h=tip.offsetHeight;
  let x=e.clientX+16,y=e.clientY+16;if(x+w>innerWidth-8)x=e.clientX-w-16;if(y+h>innerHeight-8)y=Math.max(8,innerHeight-h-8);tip.style.left=x+'px';tip.style.top=y+'px'});

/* ---------- MÊS ---------- */
function sumBadge(c,y,m){const its=cellOf(c.id,y,m)?.items||[];if(!its.length)return'';const w=its.some(i=>/sem detalhe/.test(i.d));
  const cc=its.some(i=>i.info)?' <span title="Tem valor já incluso na fatura do cartão (não soma)">💳</span>':'';
  return `<span class="sub">${its.length>1?its.length+' itens':esc(its[0].d)}</span>${cc}${w?' <span class="warn" title="A anotação antiga não batia com o total — revise">⚠</span>':''}`}
function rowMes(c,y,m){const r=V(c.id,y,m,'real'),p=V(c.id,y,m,'prev'),neg=c.tipo==='pagar',f=neg?RP:R$;
  const main=!p&&!r&&!(cellOf(c.id,y,m)?.items||[]).length?'<span class="zero">+ lançar</span>':`<span class="${neg?'neg':'pos'}" ${r?'':'style="opacity:.5"'}>${f(r)}</span>`;
  return `<tr draggable="true" data-cat="${c.id}" data-tipo="${c.tipo}"><td class="grip" title="Arraste para reordenar">⋮⋮</td>
 <td data-tipcat="${c.id}|${y}|${m}">${esc(c.nome)}${c.dia?` <span class="sub">dia ${c.dia}</span>`:''}<br>${sumBadge(c,y,m)}</td>
 <td class="n"><button class="val" data-open="${c.id}|${y}|${m}" data-tipcell="${c.id}|${y}|${m}">${main}</button>${p!==r?`<div class="sub" style="padding-right:8px">previsto ${f(p)}</div>`:''}</td></tr>`}
function shortcuts(){const st=catStats(),top=S.cats.filter(c=>st[c.id]?.recent).sort((a,b)=>st[b.id].recent-st[a.id].recent).slice(0,7);
  return top.length?`<div class="shortcuts"><span class="sub">Atalhos:</span>${top.map(c=>`<button type="button" class="sc" data-sc="${c.id}"><span class="dot ${c.tipo}"></span>${esc(c.nome)}</button>`).join('')}</div>`:''}
function vMes(){const y=selY,m=selM,R=MT('receber',y,m,'real'),P=MT('pagar',y,m,'real'),Rp=MT('receber',y,m,'prev'),Pp=MT('pagar',y,m,'prev');
  const curY=new Date().getFullYear(),curMo=new Date().getMonth();
  return `<div class="chips">${MESES.map((n,i)=>`<button class="chip ${i===m?'on':''} ${i===curMo&&y===curY?'cur':''}" data-m="${i}">${n}</button>`).join('')}<span class="sub" style="margin-left:8px">${MESES[m]} de ${y}</span></div>
  <div class="cards">
   <div class="card"><div class="l">Recebido</div><div class="v pos">${R$(R)}</div><div class="sub">previsto ${R$(Rp)}</div></div>
   <div class="card"><div class="l">Pago</div><div class="v neg">${RP(P)}</div><div class="sub">previsto ${RP(Pp)}</div></div>
   <div class="card"><div class="l">Saldo do mês</div><div class="v ${R-P>=0?'pos':'neg'}">${R$(R-P)}</div><div class="sub">previsto ${R$(Rp-Pp)}</div></div>
   <div class="card"><div class="l">Acumulado</div><div class="v">${R$(acum(y,m,'real'))}</div><div class="sub">previsto ${R$(acum(y,m,'prev'))}</div></div></div>
  <form class="quick" id="qf">
   <div class="fld">Categoria *${combo('qc',{create:1,ph:'Buscar ou criar…'})}</div>
   <label>Valor (R$) *<input id="qv" class="money" inputmode="decimal" placeholder="0,00" size="12" required></label>
   <label class="grow">O que foi (aparece na anotação)<input id="qd" placeholder="ex.: farmácia"></label>
   <label class="ck"><input type="checkbox" class="ok" id="qk" checked>&nbsp;Já pago/recebido</label>
   <button class="btn">Adicionar em ${MC[m]}/${y}</button>${shortcuts()}</form>
  <div class="two">
   <div class="panel"><h2>A receber <span class="pos">${R$(R)}</span></h2><table>${visCats('receber',y).map(c=>rowMes(c,y,m)).join('')}</table></div>
   <div class="panel"><h2>A pagar <span class="neg">${RP(P)}</span></h2><table>${visCats('pagar',y).map(c=>rowMes(c,y,m)).join('')}</table></div></div>
  <p class="hint">Só o que está marcado como pago/recebido entra nos totais; o resto é previsão. Clique num valor para editar os itens, passe o mouse para espiar, arraste ⋮⋮ para reordenar.</p>`}

/* ---------- ANO ---------- */
function vAno(){const y=selY,head=`<tr><th>Categoria</th>${MC.map(m=>`<th class="n">${m}</th>`).join('')}<th class="n">Total</th></tr>`;
  const F=(t,v)=>t==='pagar'?RP(v):R$(v),fn=v=>v.toLocaleString('pt-BR',{minimumFractionDigits:2});
  const rows=t=>visCats(t,y).map(c=>{let s=0;const tds=MC.map((_,m)=>{const v=V(c.id,y,m);s+=v;const cls=v?(t==='pagar'?'neg':'pos'):'zero';
    return `<td class="n"><button class="val ${cls}" data-open="${c.id}|${y}|${m}" data-tipcell="${c.id}|${y}|${m}">${v?(t==='pagar'?'-':'')+fn(v):'–'}</button></td>`}).join('');
    return `<tr><td data-tipcat="${c.id}|${y}|0">${esc(c.nome)}</td>${tds}<td class="n"><b class="${t==='pagar'?'neg':'pos'}">${F(t,s)}</b></td></tr>`}).join('');
  const line=(lbl,f,fix)=>{let s=0;return `<tr class="tot"><td>${lbl}</td>${MC.map((_,m)=>{const v=f(m);s+=v;const cl=fix||(v>=0?'pos':'neg');return `<td class="n ${cl}">${fix==='neg'&&v?'-':''}${fn(v)}</td>`}).join('')}<td class="n ${fix||(s>=0?'pos':'neg')}">${fix==='neg'?'-':''}${R$(s)}</td></tr>`};
  const sec=t=>`<tr class="secr"><td>${t}</td>${'<td></td>'.repeat(13)}</tr>`;
  return `<div class="row">${seg()}<span class="sub">Ano ${y}</span></div>
  <div class="panel grid"><table>${head}${sec('A RECEBER')}${rows('receber')}${line('Total a receber',m=>MT('receber',y,m),'pos')}
   ${sec('A PAGAR')}${rows('pagar')}${line('Total a pagar',m=>MT('pagar',y,m),'neg')}
   ${sec('RESULTADO')}${line('Saldo do mês',m=>SAL(y,m))}
   <tr class="tot"><td>Acumulado</td>${MC.map((_,m)=>`<td class="n">${fn(acum(y,m))}</td>`).join('')}<td></td></tr></table></div>
   <p class="hint">Clique numa célula para editar os itens. O acumulado parte do saldo inicial do ano (Ajustes) ou do fim do ano anterior.</p>`}

/* ---------- DRAWER ---------- */
const dlg=document.getElementById('dlg');let cur=null;
function openCell(cid,y,m){cur={cid,y,m};drawDlg();if(!dlg.open)dlg.showModal()}
function totals(){dlg.querySelector('#dr').textContent=fmtC(V(cur.cid,cur.y,cur.m,'real'));dlg.querySelector('#dp').textContent=fmtC(V(cur.cid,cur.y,cur.m,'prev'))}
const fmtC=n=>S.cats.find(c=>c.id===cur.cid).tipo==='pagar'?RP(n):R$(n);
function prevCellRef(){let y=cur.y,m=cur.m-1;if(m<0){m=11;y--}return[y,m]}
function drawDlg(){const c=S.cats.find(x=>x.id===cur.cid),x=ens(cur.cid,cur.y,cur.m),[py,pm]=prevCellRef(),hasPrev=(cellOf(cur.cid,py,pm)?.items||[]).length;
  dlg.innerHTML=`<div class="dh"><div><h3>${esc(c.nome)} · ${MESES[cur.m]} de ${cur.y}</h3><div class="sub">${c.tipo==='pagar'?'A pagar':'A receber'} — marque o que já foi ${c.tipo==='pagar'?'pago':'recebido'}; só isso entra no total</div></div><button class="btn sec" data-close>Fechar</button></div>
  <div class="db">${x.items.length?x.items.map((i,k)=>`<div class="item ${i.info?'info':i.ok?'':'prev'}"><input type="checkbox" class="ok" data-ik="${k}" ${i.ok&&!i.info?'checked':''} ${i.info?'disabled':''} title="${c.tipo==='pagar'?'Pago':'Recebido'}"><input class="money" data-iv="${k}" value="${fmtN(i.v)}" inputmode="decimal" aria-label="valor"><input data-id="${k}" value="${esc(i.d)}" placeholder="descrição" aria-label="descrição"><button data-info="${k}" class="cc ${i.info?'on':''}" title="Marcar como já incluso na fatura do cartão (informativo, não soma)">💳</button><button data-del="${k}" title="Remover">✕</button></div>`).join(''):'<p class="hint">Nenhum item ainda. Adicione abaixo.</p>'}
   <div class="item" style="margin-top:10px"><input type="checkbox" class="ok" id="nk" checked title="Já ${c.tipo==='pagar'?'pago':'recebido'}"><input id="nv" class="money" placeholder="0,00" inputmode="decimal"><input id="nd" placeholder="descrição (Enter para adicionar)"><span></span><button class="btn" style="padding:4px" data-add title="Adicionar">＋</button></div></div>
  <div class="df"><div><span class="sub">${c.tipo==='pagar'?'Pago':'Recebido'}</span><div class="big" id="dr"></div><div class="sub">Previsto: <span id="dp"></span></div></div>
   <div class="row" style="margin:0"><button class="btn sec sm" data-allok>Marcar todos</button>${hasPrev?`<button class="btn sec sm" data-copyprev title="Copia os itens de ${MESES[pm]} como previsão">Copiar do mês anterior</button>`:''}</div></div>`;
  totals();setTimeout(()=>dlg.querySelector('#nv')?.focus(),0)}
function addItem(){const v=parseV(dlg.querySelector('#nv').value),d=dlg.querySelector('#nd').value.trim();if(!v&&!d)return;
  ens(cur.cid,cur.y,cur.m).items.push({v,d,ok:dlg.querySelector('#nk').checked});save();drawDlg()}
dlg.addEventListener('click',e=>{const t=e.target,x=cur&&ens(cur.cid,cur.y,cur.m);
  if(t.closest('[data-close]'))dlg.close();
  else if(t.closest('[data-add]'))addItem();
  else if(t.dataset.del!==undefined){x.items.splice(+t.dataset.del,1);save();drawDlg()}
  else if(t.dataset.info!==undefined){const i=x.items[+t.dataset.info];i.info=!i.info;if(!i.info)delete i.info;save();drawDlg()}
  else if(t.closest('[data-allok]')){x.items.forEach(i=>{if(!i.info)i.ok=true});save();drawDlg()}
  else if(t.closest('[data-copyprev]')){const[py,pm]=prevCellRef();ens(cur.cid,cur.y,cur.m).items=structuredClone(cellOf(cur.cid,py,pm).items.filter(i=>!/sem detalhe/.test(i.d))).map(i=>({...i,ok:false}));save();drawDlg()}
  else if(t===dlg)dlg.close()});
dlg.addEventListener('input',e=>{const t=e.target,x=ens(cur.cid,cur.y,cur.m);
  if(t.dataset.iv!==undefined){x.items[+t.dataset.iv].v=parseV(t.value);save();totals()}
  else if(t.dataset.id!==undefined){x.items[+t.dataset.id].d=t.value;save()}});
dlg.addEventListener('change',e=>{const t=e.target;if(t.dataset.ik!==undefined){ens(cur.cid,cur.y,cur.m).items[+t.dataset.ik].ok=t.checked;save();t.closest('.item').classList.toggle('prev',!t.checked);totals()}});
dlg.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='nv'||e.target.id==='nd')){e.preventDefault();addItem()}});
dlg.addEventListener('close',()=>{cur=null;render()});

  <div class="gh">Visão geral</div><div class="charts">

  </div>

function drawCharts(){

  const mk=(id,cfg)=>CH.push(new Chart(document.getElementById(id),cfg));
  const R=ms.map(m=>MT('receber',y,m)),P=ms.map(m=>MT('pagar',y,m)),B=ms.map(m=>SAL(y,m));
  const sum=a=>a.reduce((x,z)=>x+z,0),avg=a=>sum(a)/(a.length||1),best=B.indexOf(Math.max(...B)),worst=B.indexOf(Math.min(...B));
  const falR=sum(ms.map(m=>MT('receber',y,m,'prev')-MT('receber',y,m,'real'))),falP=sum(ms.map(m=>MT('pagar',y,m,'prev')-MT('pagar',y,m,'real')));
  document.getElementById('kpis').innerHTML=[['Total receber',fmt(sum(R)),'pos'],['Total pagar',RP(sum(P)),'neg'],['Saldo do ano',fmt(sum(B)),sum(B)>=0?'pos':'neg'],['Média receber/mês',fmt(avg(R)),'pos'],['Média pagar/mês',RP(avg(P)),'neg'],
    ['Melhor mês',`${MESES[best]}<div class="sub">${fmt(B[best])}</div>`,'pos'],['Pior mês',`${MESES[worst]}<div class="sub">${fmt(B[worst])}</div>`,'neg'],['Ainda falta receber',fmt(falR),''],['Ainda falta pagar',RP(falP),'']]
    .map(([l,v,c])=>`<div class="card"><div class="l">${l}</div><div class="v ${c}" style="font-size:18px">${v}</div></div>`).join('');
  const noleg={legend:{display:false}};
  mk('c1',{data:{labels:lab,datasets:[{type:'bar',label:'Receber',data:R,backgroundColor:PAL[2]},{type:'bar',label:'Pagar',data:P,backgroundColor:PAL[3]},{type:'line',label:'Saldo',data:B,borderColor:PAL[0],backgroundColor:PAL[0],tension:.25}]},options:{maintainAspectRatio:false,scales:{y:ax},plugins:{tooltip:tip}}});
  mk('c2',{type:'line',data:{labels:lab,datasets:[{label:'Acumulado',data:ms.map(m=>acum(y,m)),borderColor:PAL[0],backgroundColor:PAL[0]+'33',fill:true,tension:.25}]},options:{maintainAspectRatio:false,scales:{y:ax},plugins:{...noleg,tooltip:tip}}});

  mk('c4',{type:'bar',data:{labels:lab,datasets:[{label:'Poupança',data:ms.map((m,i)=>R[i]>0?+(B[i]/R[i]*100).toFixed(1):null),backgroundColor:ms.map((m,i)=>B[i]>=0?PAL[2]:PAL[3])}]},options:{maintainAspectRatio:false,scales:{y:{ticks:{callback:v=>v+'%'}}},plugins:{...noleg,tooltip:{callbacks:{label:c=>` ${c.parsed.y}%`}}}}});
  mk('c5',{type:'bar',data:{labels:lab,datasets:[{label:'Receber previsto',data:ms.map(m=>MT('receber',y,m,'prev')),backgroundColor:PAL[2]+'66'},{label:'Receber realizado',data:ms.map(m=>MT('receber',y,m,'real')),backgroundColor:PAL[2]},{label:'Pagar previsto',data:ms.map(m=>MT('pagar',y,m,'prev')),backgroundColor:PAL[3]+'66'},{label:'Pagar realizado',data:ms.map(m=>MT('pagar',y,m,'real')),backgroundColor:PAL[3]}]},options:{maintainAspectRatio:false,scales:{y:ax},plugins:{tooltip:tip}}});
  const catTot=t=>cats(t).map(c=>({n:c.nome,v:sum(ms2.map(m=>V(c.id,y,m)))})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);

  const g={},all=[];cats('pagar').forEach(c=>ms2.forEach(m=>itemsOf(c.id,y,m).forEach(i=>{if(/sem detalhe/.test(i.d)||i.v<=0)return;const k=(i.d||c.nome).trim().toLowerCase();g[k]=(g[k]||0)+i.v;all.push({n:`${i.d||c.nome} (${c.nome} · ${MC[m]})`,v:i.v})})));

  const nm=Math.max(1,ms2.filter(m=>MT('receber',y,m,'prev')>0).length);hb('c11',pt.map(x=>({n:x.n,v:x.v/nm})),PAL[5]);
  const dias=Array.from({length:31},(_,i)=>i+1),byDia=dias.map(d=>sum(cats('pagar').filter(c=>c.dia===d).map(c=>sum(ms2.map(m=>V(c.id,y,m))))));
  const semDia=sum(cats('pagar').filter(c=>!c.dia).map(c=>sum(ms2.map(m=>V(c.id,y,m)))));
  mk('c12',{type:'bar',data:{labels:[...dias,'s/ dia'],datasets:[{data:[...byDia,semDia],backgroundColor:PAL[3]}]},options:{maintainAspectRatio:false,scales:{y:ax},plugins:{...noleg,tooltip:{callbacks:{label:c=>' '+fmt(c.parsed.y)}}}}});
  const rc=catTot('receber');
  mk('c13',{type:'doughnut',data:{labels:rc.map(x=>x.n),datasets:[{data:rc.map(x=>x.v),backgroundColor:PAL}]},options:{maintainAspectRatio:false,plugins:{tooltip:{callbacks:{label:c=>` ${c.label}: ${fmt(c.parsed)}`}},legend:{position:'right'}}}});
  mk('c14',{type:'bar',data:{labels:lab,datasets:cats('receber').filter(c=>ms.some(m=>V(c.id,y,m)>0)).map((c,i)=>({label:c.nome,backgroundColor:PAL[i%10],data:ms.map(m=>V(c.id,y,m))}))},options:{maintainAspectRatio:false,scales:{x:{stacked:true},y:{stacked:true,...ax}},plugins:{tooltip:tip}}});
  const cc=S.cats.find(c=>c.id===catSel);
  if(cc)mk('c15',{type:'bar',data:{labels:lab,datasets:[{label:cc.nome,data:ms.map(m=>V(cc.id,y,m)),backgroundColor:cc.tipo==='pagar'?PAL[3]:PAL[2]}]},options:{maintainAspectRatio:false,scales:{y:ax},plugins:{...noleg,tooltip:tip}}});
  const tot=t=>S.anos.map(a=>sum(MC.map((_,m)=>MT(t,a,m))));
  mk('c16',{type:'bar',data:{labels:S.anos,datasets:[{label:'Receber',data:tot('receber'),backgroundColor:PAL[2]},{label:'Pagar',data:tot('pagar'),backgroundColor:PAL[3]},{label:'Saldo',data:S.anos.map((a,i)=>tot('receber')[i]-tot('pagar')[i]),backgroundColor:PAL[0]}]},options:{maintainAspectRatio:false,scales:{y:ax},plugins:{tooltip:tip}}});
}

const CBVAL={};

  return `<div class="cb" data-id="${id}" data-tipo="${o.tipo||''}" data-create="${o.create?1:0}" data-exclude="${o.exclude||''}"><input class="cbi" id="${id}in" autocomplete="off" placeholder="${o.ph||'Buscar categoria…'}" value="${c?esc(c.nome):''}"><div class="cbl" hidden></div></div>`};
function cbHtml(root,q){const t=root.dataset.tipo,ex=root.dataset.exclude,st=catStats(),nq=normName(q.trim());
  const list=S.cats.filter(c=>(!t||c.tipo===t)&&c.id!==ex),rec=c=>st[c.id]?.recent||0,lst=c=>st[c.id]?.last??-1;
  const row=c=>{const x=st[c.id],act=isActive(c,st);return `<div class="cbo" data-pick="${c.id}"><span class="dot ${c.tipo}"></span><span class="nm">${esc(c.nome)}</span><span class="tg">${x?(act?lastLabel(x.last):'antiga · '+lastLabel(x.last)):'nova'}</span></div>`};
  let h='';
  if(!nq){[['pagar','A pagar · mais usadas'],['receber','A receber · mais usadas']].forEach(([tp,lb])=>{
      const a=list.filter(c=>c.tipo===tp&&isActive(c,st)).sort((a,b)=>rec(b)-rec(a)||lst(b)-lst(a)).slice(0,8);if(a.length)h+=`<div class="cbh">${lb}</div>`+a.map(row).join('')});
    h+=`<div class="cbh">Digite para buscar entre as ${list.length} categorias</div>`}
  else{const toks=nq.split(' '),m=list.filter(c=>toks.every(x=>normName(c.nome).includes(x)))
      .sort((a,b)=>(normName(b.nome).startsWith(nq)-normName(a.nome).startsWith(nq))||(isActive(b,st)-isActive(a,st))||rec(b)-rec(a)||lst(b)-lst(a));
    h+=m.slice(0,30).map(row).join('')||'<div class="cbh">Nenhuma categoria encontrada</div>';
    if(m.length>30)h+=`<div class="cbh">+${m.length-30} — continue digitando para filtrar</div>`;
    if(root.dataset.create==='1'&&!list.some(c=>normName(c.nome)===nq))h+=`<div class="cbh">Não achou? Crie agora</div>`+['pagar','receber'].map(tp=>`<div class="cbo" data-new="${tp}"><span class="dot ${tp}"></span><span class="nm">＋ Criar “${esc(q.trim())}” em ${tp==='pagar'?'A pagar':'A receber'}</span></div>`).join('')}
  return h}
function cbOpen(root){const box=root.querySelector('.cbl');box.innerHTML=cbHtml(root,root.querySelector('.cbi').value);box.hidden=false;root._act=0;cbMark(root)}
function cbMark(root){const os=[...root.querySelectorAll('.cbo')];os.forEach((o,i)=>o.classList.toggle('act',i===root._act));os[root._act]?.scrollIntoView({block:'nearest'})}
function cbPick(root,cid){const c=S.cats.find(x=>x.id===cid);CBVAL[root.dataset.id]=cid;root.querySelector('.cbi').value=c.nome;root.querySelector('.cbl').hidden=true;
  root.dispatchEvent(new CustomEvent('cbpick',{bubbles:true,detail:{id:root.dataset.id,cid}}))}

  else if(o.dataset.new){const nome=root.querySelector('.cbi').value.trim().replace(/\s+/g,' ');const c={id:'c'+Date.now(),tipo:o.dataset.new,nome,dia:null};S.cats.push(c);save();cbPick(root,c.id)}}
document.addEventListener('focusin',e=>{const r=e.target.closest?.('.cb');if(r&&e.target.classList.contains('cbi')){e.target.select();cbOpen(r)}});
document.addEventListener('focusout',e=>{const r=e.target.closest?.('.cb');if(r&&!r.contains(e.relatedTarget))r.querySelector('.cbl').hidden=true});
document.addEventListener('input',e=>{const r=e.target.closest?.('.cb');if(r&&e.target.classList.contains('cbi')){CBVAL[r.dataset.id]=null;cbOpen(r)}});
document.addEventListener('keydown',e=>{const r=e.target.closest?.('.cb');if(!r||!e.target.classList.contains('cbi'))return;

  else if(e.key==='ArrowUp'){e.preventDefault();r._act=Math.max(0,r._act-1);cbMark(r)}
  else if(e.key==='Enter'){e.preventDefault();cbChoose(r,r.querySelectorAll('.cbo')[r._act])}
  else if(e.key==='Escape'){r.querySelector('.cbl').hidden=true}});

/* ---------- GERENCIADOR DE CATEGORIAS (Ajustes) ---------- */
let catUI={q:'',filtro:'ativas',tipo:'',lim:40};
function catRows(){const st=catStats(),nq=normName(catUI.q);
  let l=S.cats.filter(c=>(!catUI.tipo||c.tipo===catUI.tipo));
  if(nq){const tk=nq.split(' ');l=l.filter(c=>tk.every(x=>normName(c.nome).includes(x)))}
  else if(catUI.filtro==='ativas')l=l.filter(c=>isActive(c,st));
  else if(catUI.filtro==='sem')l=l.filter(c=>!st[c.id]);
  else if(catUI.filtro==='antigas')l=l.filter(c=>st[c.id]&&!isActive(c,st));
  l.sort((a,b)=>(st[b.id]?.last??-1)-(st[a.id]?.last??-1)||normName(a.nome).localeCompare(normName(b.nome)));
  const tot=l.length;
  const html=l.slice(0,catUI.lim).map(c=>{const x=st[c.id];return `<div class="cr"><span class="dot ${c.tipo}" title="${c.tipo==='pagar'?'A pagar':'A receber'}"></span>
   <input class="cn" data-cn="${c.id}" value="${esc(c.nome)}" aria-label="Nome"><input class="cd xs" data-cd="${c.id}" value="${c.dia??''}" placeholder="dia" title="Dia do vencimento" aria-label="Dia">
   <span class="sub xs">${x?'último uso '+lastLabel(x.last):'sem lançamentos'}</span><span class="sub xs">${x?x.n+' lanç.':''}</span>
   <button class="btn sec sm" data-cmerge="${c.id}" title="Juntar com outra categoria">Mesclar</button><button class="btn dan sm" data-cdel="${c.id}" title="Excluir">✕</button></div>`}).join('')||'<p class="hint" style="padding:14px 4px">Nenhuma categoria com esse filtro.</p>';
  return{html:html+(tot>catUI.lim?`<div style="padding:10px 4px"><button class="btn sec sm" data-cmore>Mostrar mais ${Math.min(40,tot-catUI.lim)} (${tot-catUI.lim} restantes)</button></div>`:''),tot}}
function renderCatList(){const r=catRows(),el=document.getElementById('cl');if(!el)return;el.innerHTML=r.html;document.getElementById('cc').textContent=`${r.tot} de ${S.cats.length}`}
function catPanel(){const r=catRows(),sg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-cf="${k}|${v}" class="${catUI[k]===v?'on':''}">${l}</button>`).join('')}</div>`;
  return `<div class="panel" style="margin-top:16px"><h2>Categorias <span class="sub" id="cc">${r.tot} de ${S.cats.length}</span></h2><div style="padding:12px 14px">
   <div class="row"><input id="cq" type="search" placeholder="🔍 Buscar categoria…" value="${esc(catUI.q)}" style="flex:1;min-width:200px">
    ${sg('filtro',[['ativas','Ativas'],['antigas','Antigas'],['sem','Sem lançamentos'],['todas','Todas']])}${sg('tipo',[['','Todas'],['receber','A receber'],['pagar','A pagar']])}</div>
   <p class="hint" style="margin:2px 0 8px">“Ativas” = usadas nos últimos 24 meses. Ao buscar, aparecem todas. Clique no nome para renomear.</p>
   <div class="row"><input id="ncn" placeholder="Nova categoria…" style="min-width:200px"><select id="nct"><option value="pagar">A pagar</option><option value="receber">A receber</option></select><button class="btn sec sm" data-cnew>＋ Criar</button></div>
   <div id="cl">${r.html}</div></div></div>`}

/* ---------- EVENTOS ---------- */
const app=document.getElementById('app');
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}});
document.getElementById('hr').addEventListener('click',e=>{
  if(e.target.closest('[data-logout]'))logout();
  else if(e.target.closest('[data-addyear]')){const def=Math.max(...S.anos)+1,v=parseInt(prompt('Qual ano deseja adicionar?',def));
    if(v>=1990&&v<=2100){if(!S.anos.includes(v)){S.anos.push(v);S.anos.sort((a,b)=>a-b);save()}selY=v;selM=0;render()}}});
document.addEventListener('input',e=>{if(e.target.id==='cq'){catUI.q=e.target.value;catUI.lim=40;renderCatList()}});
document.getElementById('hr').addEventListener('change',e=>{if(e.target.id==='ysel'){selY=+e.target.value;render()}});
let dragId=null;
app.addEventListener('dragstart',e=>{const r=e.target.closest?.('tr[data-cat]');if(!r)return;dragId=r.dataset.cat;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId);r.classList.add('dragging');tip.style.display='none'});
app.addEventListener('dragover',e=>{const r=e.target.closest?.('tr[data-cat]');if(!r||!dragId)return;
  if(S.cats.find(c=>c.id===dragId).tipo!==r.dataset.tipo)return;e.preventDefault();app.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));r.classList.add('over')});
app.addEventListener('drop',e=>{const r=e.target.closest?.('tr[data-cat]');if(!r||!dragId||r.dataset.cat===dragId)return;e.preventDefault();
  const fi=S.cats.findIndex(c=>c.id===dragId),oti=S.cats.findIndex(c=>c.id===r.dataset.cat),[it]=S.cats.splice(fi,1);
  let ti=S.cats.findIndex(c=>c.id===r.dataset.cat);if(fi<oti)ti++;S.cats.splice(ti,0,it);dragId=null;save();render()});
app.addEventListener('dragend',()=>{dragId=null;app.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'))});
app.addEventListener('click',e=>{const t=e.target;let b;
  if(b=t.closest('[data-lm]')){loginMode=b.dataset.lm;render()}
  else if(b=t.closest('[data-modo]')){modo=b.dataset.modo;render()}
  else if(b=t.closest('[data-m]')){selM=+b.dataset.m;render()}
  else if(b=t.closest('[data-open]')){const[c,y,m]=b.dataset.open.split('|');tip.style.display='none';openCell(c,+y,+m)}
  else if(b=t.closest('[data-la]')){S[b.dataset.la].push({nome:'Novo item',valor:0});save();render()}
  else if(b=t.closest('[data-ld]')){const[k,i]=b.dataset.ld.split('|');S[k].splice(+i,1);save();render()}
  else if(b=t.closest('[data-sc]')){const c=S.cats.find(x=>x.id===b.dataset.sc);CBVAL.qc=c.id;document.getElementById('qcin').value=c.nome;document.getElementById('qv').focus()}
  else if(b=t.closest('[data-cf]')){const[k,v]=b.dataset.cf.split('|');catUI[k]=v;catUI.lim=40;render()}
  else if(t.closest('[data-cmore]')){catUI.lim+=40;renderCatList()}
  else if(b=t.closest('[data-cmerge]'))openMerge(b.dataset.cmerge)
  else if(t.closest('[data-cnew]')){const n=document.getElementById('ncn').value.trim().replace(/\s+/g,' ');if(!n){document.getElementById('ncn').focus();return}
    S.cats.push({id:'c'+Date.now(),tipo:document.getElementById('nct').value,nome:n,dia:null});save();catUI.q=n;catUI.filtro='ativas';render()}
  else if(b=t.closest('[data-cdel]')){const c=S.cats.find(x=>x.id===b.dataset.cdel);const nl=catStats()[c.id]?.n||0;if(confirm(nl?`Excluir “${c.nome}” e os ${nl} lançamentos dela (em todos os anos)? Para juntar com outra categoria, use Mesclar.`:`Excluir “${c.nome}”?`)){S.cats=S.cats.filter(x=>x!==c);Object.keys(S.data).filter(k=>k.startsWith(c.id+'|')).forEach(k=>delete S.data[k]);save();render()}}
  else if(t.id==='bk'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download=`orcamento-backup-${new Date().toISOString().slice(0,10)}.json`;a.click()}
  else if(t.id==='csv'){const rows=[['Ano','Tipo','Categoria',...MESES,'Total']];S.anos.forEach(y=>S.cats.forEach(c=>{const v=MESES.map((_,m)=>V(c.id,y,m,'real'));rows.push([y,c.tipo,c.nome,...v.map(x=>x.toFixed(2).replace('.',',')),v.reduce((a,b)=>a+b,0).toFixed(2).replace('.',',')])}));
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(';')).join('\n')],{type:'text/csv'}));a.download='orcamento.csv';a.click()}});
app.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='lf')doLogin();
  else if(e.target.id==='qf'){const c=CBVAL.qc,v=parseV(qv.value),d=qd.value.trim();if(!c){document.getElementById('qcin').focus();return}if(!v){qv.focus();return}
    ens(c,selY,selM).items.push({v,d,ok:qk.checked});save();render();document.getElementById('qcin').focus()}});
app.addEventListener('change',e=>{const t=e.target,d=t.dataset;
  if(t.id==='per'){period=t.value;render()}
  else if(t.id==='si'){if(t.value.trim()==='')delete S.saldoIni[selY];else S.saldoIni[selY]=parseV(t.value);save()}
  else if(d.ln){const[k,i]=d.ln.split('|');S[k][i].nome=t.value;save()}
  else if(d.lv){const[k,i]=d.lv.split('|');S[k][i].valor=parseV(t.value);save();render()}
  else if(d.cn){S.cats.find(c=>c.id===d.cn).nome=t.value;save()}
  else if(d.cd){S.cats.find(c=>c.id===d.cd).dia=parseInt(t.value)||null;save()}
  else if(t.id==='imp'){const f=t.files[0];if(!f)return;f.text().then(x=>{try{const o=JSON.parse(x);if(!o.cats||!o.data||!o.anos)throw 0;mergeImport(o)}catch(err){alert('Arquivo de importação inválido.')}t.value=''})}
  else if(t.id==='rs'){const f=t.files[0];if(!f)return;f.text().then(x=>{try{const s=JSON.parse(x);if(!s.cats||!s.data)throw 0;S=mig(s);if(!S.anos.includes(selY))selY=S.anos[S.anos.length-1];save();render()}catch{alert('Arquivo de backup inválido.')}})}});
function normName(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim()}
function mergeImport(o){const hasY=y=>Object.keys(S.data).some(k=>k.split('|')[1]==y&&S.data[k].items.length);
  const clash=o.anos.filter(hasY);
  if(clash.length&&!confirm(`Os anos ${clash.join(', ')} já têm lançamentos e serão SUBSTITUÍDOS pelos do arquivo. Continuar?`))return;
  const map={};o.cats.forEach(c=>{let ex=S.cats.find(x=>x.tipo===c.tipo&&normName(x.nome)===normName(c.nome));
    if(!ex){ex={id:'c'+Math.random().toString(36).slice(2,9),tipo:c.tipo,nome:c.nome,dia:c.dia};S.cats.push(ex)}else if(!ex.dia&&c.dia)ex.dia=c.dia;map[c.id]=ex.id});
  Object.keys(S.data).filter(k=>o.anos.includes(+k.split('|')[1])).forEach(k=>delete S.data[k]);
  for(const[k,v]of Object.entries(o.data)){const[c,y,m]=k.split('|');S.data[`${map[c]}|${y}|${m}`]=v}
  o.anos.forEach(y=>{if(!S.anos.includes(y))S.anos.push(y)});S.anos.sort((a,b)=>a-b);
  Object.entries(o.saldoIni||{}).forEach(([y,v])=>S.saldoIni[y]=v);
  save();render();alert(`Importado: anos ${o.anos.join(', ')}.`)}
/* ---------- BOOT ---------- */
(function(){if(CLOUD){document.getElementById('app').innerHTML='<p class="hint" style="padding:60px 0;text-align:center">Carregando…</p>';
  fbAuth.onAuthStateChanged(u=>{if(u){if(!S||uid!==u.uid)cloudStart(u)}else{uid=null;user=null;S=null;render()}});return}
  let e=null;try{e=sessionStorage.getItem('orc-sess')||localStorage.getItem('orc-sess')}catch{}
  if(e&&users()[e])startSession(e,!!localStorage.getItem('orc-sess'));else render()})();
</script>
